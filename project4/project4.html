<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number</title>
    <link rel="stylesheet" href="project4.css">
</head>
<body>
    <div class="nav">Number guessing game</div>
    <div class="p">
        <p>Try and guess a random number between 1 and 100.</p>
        <p>You have 10 attempts to guess the right number.</p>
    </div>
    <div class="heading">Guess a number
        <input type="number" id="guessField"></input>
        <button id="click">Submit</button>
    </div>
    <div class="resultParas">
        <div class="remaining">Guesses remaining: <span class="lastResult">10</span></div>
        <div class="result"></div>
    </div>
    <script src="project4.js"></script>
</body>
</html>
