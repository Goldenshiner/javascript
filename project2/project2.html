<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="project2.css">
</head>
<body>
    <div class="main">
        <div class="heading">BMI Calculator</div>
        <span class="height">Heigth in cm:
            <input type="text" placeholder="Enter your height">
        </span>
        <span class="weight">Weight in kg:
            <input type="text" placeholder="Enter your weight">
        </span>
        <div class="button">
            <button id="hit">Calculate</button>
        </div>
        <div class="result"></div>
        <div class="guide">BMI Guide</div>
        <div class="information">
            <p>Under weight = less than 18.6</p>
            <p>Normal range = between 18.6 to 24.9</p>
            <p>Over weight = gteater than 24.9</p>
        </div>
    </div>
    <script src="project2.js"></script>
</body>
</html>
