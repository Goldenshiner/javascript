<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Learning</title>
     <style>
        body{
            background-color:rgb(70, 157, 179);
            color: white;
        }
    </style>
</head>
<body>
    
</body>
<script>
    const div= document.createElement('div');
    console.log(div);
    div.className= 'main';
    div.setAttribute("title", "generated title");
    div.style.backgroundColor= "orange";
    div.style.color= "white";
    //div.innerHTML= "This is a generated div";
    const addText= document.createTextNode("This is a generated text node");
    div.appendChild(addText);
    document.body.appendChild(div);
</script>
</html>
